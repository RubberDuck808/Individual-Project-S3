stages:
  - build
  - test
  - sonar
  - docker
  - deploy

variables:
  DOCKER_HOST: tcp://host.docker.internal:2375
  DOCKER_TLS_CERTDIR: ""

  GCP_REGION: europe-west4
  GCP_PROJECT: tripwire-477820

  # SonarQube server
  SONAR_HOST_URL: "http://host.docker.internal:9000"
  
  # Docker image pull policy - use if-not-present to avoid network issues
  DOCKER_PULL_POLICY: "if-not-present"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/

# ================================
# Backend build
# ================================
backend-build:
  stage: build
  image: 
    name: gradle:8.9-jdk21
    pull_policy: if-not-present
  script:
    - cd backend
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ================================
# Frontend build
# ================================
frontend-build:
  stage: build
  image: 
    name: node:22
    pull_policy: if-not-present
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ================================
# Backend tests + JaCoCo coverage (WITH POSTGRES)
# ================================
backend-test:
  stage: test
  image: 
    name: gradle:8.9-jdk21
    pull_policy: if-not-present

  services:
    - name: postgres:16
      alias: postgres
      pull_policy: if-not-present
    - name: docker:24-dind
      alias: docker
      pull_policy: if-not-present

  variables:
    # prevent PlaceholderResolutionException from app.jwt.secret=${JWT_SECRET}
    JWT_SECRET: "ci-test-secret"

    # optional: only if you have application-test.properties and want it used
    SPRING_PROFILES_ACTIVE: "test"

    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test

    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/testdb"
    SPRING_DATASOURCE_USERNAME: "test"
    SPRING_DATASOURCE_PASSWORD: "test"

    SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
    SPRING_FLYWAY_ENABLED: "false"

    # Docker-in-Docker for Testcontainers
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info

  script:
    - cd backend
    - ./gradlew test jacocoTestReport

  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/jacoco/

  needs:
    - backend-build

# ================================
# Frontend tests + Coverage
# ================================
frontend-test:
  stage: test
  image: 
    name: node:22
    pull_policy: if-not-present
  allow_failure: false
  script:
    - cd frontend
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage/
      - frontend/coverage/lcov.info
  needs:
    - frontend-build

# ================================
# SONARQUBE BACKEND ANALYSIS
# ================================
sonarqube-backend:
  stage: sonar
  image: 
    name: gradle:8.9-jdk21
    pull_policy: if-not-present
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-backend-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - cd backend
    - ./gradlew sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=false -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
  needs:
    - backend-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ================================
# SONARQUBE FRONTEND ANALYSIS
# ================================
sonarqube-frontend:
  stage: sonar
  image: 
    name: node:22
    pull_policy: if-not-present
  allow_failure: true #(DOES NOT FAIL PIPELINE)
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-frontend-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - SONAR_TOKEN=$SONAR_TOKEN SONAR_HOST_URL=$SONAR_HOST_URL npm run sonar
  needs:
    - frontend-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ================================
# Docker backend build + push
# ================================
docker-backend:
  stage: docker
  image: 
    name: docker:24
    pull_policy: if-not-present
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA -f backend/Dockerfile backend/
    - docker push rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-backend:latest
    - docker push rubberduck808/tripwire-backend:latest
  needs:
    - backend-build
  only:
    - main

# ================================
# Docker frontend build + push
# ================================
docker-frontend:
  stage: docker
  image: 
    name: docker:24
    pull_policy: if-not-present
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build --build-arg VITE_API_URL="$VITE_API_URL" --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" -t rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA -f frontend/Dockerfile frontend/
    - docker push rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-frontend:latest
    - docker push rubberduck808/tripwire-frontend:latest
  needs:
    - frontend-build
  only:
    - main

# ================================
# Deploy BACKEND to Cloud Run
# ================================
deploy-backend:
  stage: deploy
  image: 
    name: google/cloud-sdk:latest
    pull_policy: if-not-present
  needs:
    - docker-backend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project $GCP_PROJECT
  script:
    - gcloud run deploy tripwire-backend --image=docker.io/rubberduck808/tripwire-backend:latest --region=$GCP_REGION --platform=managed --allow-unauthenticated --port=8080
  only:
    - main

# ================================
# Deploy FRONTEND to Cloud Run
# ================================
deploy-frontend:
  stage: deploy
  image: 
    name: google/cloud-sdk:latest
    pull_policy: if-not-present
  needs:
    - docker-frontend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project $GCP_PROJECT
  script:
    - gcloud run deploy tripwire-frontend --image=docker.io/rubberduck808/tripwire-frontend:latest --region=$GCP_REGION --platform=managed --allow-unauthenticated --port=80
  only:
    - main
