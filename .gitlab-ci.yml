stages:
  - build

before_script:
  - echo "Running pipeline on branch: $CI_COMMIT_REF_NAME"

# === Backend build ===
backend-build:
  stage: build
  image: gradle:8.5-jdk17
  script:
    - cd Tripwire/backend
    - ./gradlew clean build
  artifacts:
    paths:
      - Tripwire/backend/build/libs/
    expire_in: 1 week

# === Frontend build ===
frontend-build:
  stage: build
  image: node:18
  script:
    - cd Tripwire/frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - Tripwire/frontend/dist/
      - Tripwire/frontend/build/
    expire_in: 1 week
