stages:
  - build
  - test
  - sonar
  - docker
  - deploy

variables:
  GCP_REGION: europe-west4
  GCP_PROJECT: tripwire-477820

  # SonarQube server (running on your PC)
  SONAR_HOST_URL: "http://host.docker.internal:9000"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/

# ================================
# Backend build (NO TESTS HERE)
# ================================
backend-build:
  stage: build
  image: gradle:8.9-jdk21
  script:
    - cd backend
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ================================
# Frontend build
# ================================
frontend-build:
  stage: build
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ================================
# Backend tests + JaCoCo coverage
# ================================
backend-test:
  stage: test
  image: gradle:8.9-jdk21
  services:
    - name: postgres:16
      alias: postgres
  variables:
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"

    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test

    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/testdb"
    SPRING_DATASOURCE_USERNAME: "test"
    SPRING_DATASOURCE_PASSWORD: "test"

    SPRING_FLYWAY_ENABLED: "true"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  script:
    - cd backend
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do echo "waiting for postgres..."; sleep 1; done
    - ./gradlew test jacocoTestReport
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/jacoco/
      - backend/build/test-results/
      - backend/build/classes/
      - backend/build/reports/tests/
    expire_in: 1 week
  needs:
    - backend-build

# ================================
# Frontend Unit Tests + Coverage
# ================================
frontend-test:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage/
      - frontend/coverage/lcov.info
    expire_in: 1 week
  needs:
    - frontend-build

# ================================
# Docker Diagnostic Job - Test Docker Access (for debugging)
# ================================
docker-diagnostic:
  stage: test
  image: docker:24
  variables:
    # Force socket-based Docker (no DinD). Prevents inherited DOCKER_HOST=tcp://docker:2375.
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "=== Docker Diagnostic ==="
    - echo "Checking Docker installation..."
    - docker --version
    - docker compose version || echo "docker compose not available"
    - echo ""
    - echo "Checking Docker socket access..."
    - ls -la /var/run/docker.sock 2>&1 || echo "Docker socket not found at /var/run/docker.sock"
    - echo ""
    - echo "Testing Docker daemon connection..."
    - docker info 2>&1 || echo "Cannot connect to Docker daemon"
    - echo ""
    - echo "Testing docker compose..."
    - docker compose version 2>&1 || echo "docker compose failed"
    - echo ""
    - echo "Checking environment..."
    - env | grep -i docker || echo "No DOCKER_* environment variables found"
  allow_failure: true
  rules:
    - if: '$CI_DEBUG_TRACE == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: manual

# ================================
# Frontend E2E Tests (Cypress) - Option B (docker job + cypress container)
# ================================
frontend-e2e:
  stage: test
  image: docker:24
  variables:
    COMPOSE_PROJECT_NAME: "e2e-${CI_PIPELINE_ID}"
    # Force socket-based Docker (no DinD). Prevents inherited DOCKER_HOST=tcp://docker:2375.
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    CYPRESS_BASE_URL: "http://host.docker.internal:5174"
    CYPRESS_API_URL: "http://host.docker.internal:8081"
    VITE_API_URL: "http://host.docker.internal:8081"
    VITE_MAPBOX_TOKEN: "test"
  before_script:
    - apk add --no-cache docker-cli-compose curl
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml down -v --remove-orphans || true
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml up -d --build
    - until curl -fsS http://host.docker.internal:8081/actuator/health >/dev/null; do sleep 2; done
    - until curl -fsS http://host.docker.internal:5174 >/dev/null; do sleep 2; done
  script:
    - |
      docker run --rm \
        -e CYPRESS_BASE_URL="$CYPRESS_BASE_URL" \
        -e CYPRESS_API_URL="$CYPRESS_API_URL" \
        -v "$CI_PROJECT_DIR/frontend:/e2e" \
        -w /e2e \
        cypress/included:13.15.0 \
        sh -c "npm ci && npx cypress run --headless --browser chrome"
  after_script:
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs --no-color || true
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml down -v --remove-orphans || true
  artifacts:
    when: always
    paths:
      - frontend/cypress/results/
      - frontend/cypress/screenshots/
      - frontend/cypress/videos/
    expire_in: 1 week
  needs:
    - backend-build
    - frontend-build
    - frontend-test

# ================================
# SONARQUBE BACKEND ANALYSIS
# ================================
sonarqube-backend:
  stage: sonar
  image: gradle:8.9-jdk21
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"
  cache:
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - backend/.gradle/
  script:
    - cd backend
    - |
      if [ ! -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
        echo "ERROR: JaCoCo report not found. Ensure backend-test completed successfully."
        exit 1
      fi
    - |
      ./gradlew sonar \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=false \
        -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
        -Dsonar.tests=src/test/java \
        -Dsonar.test.inclusions="**/*Test.java,**/*IT.java" \
        -Dsonar.exclusions="src/test/java/nl/fontys/db3/backend/BackendApplicationTests.java"
  needs:
    - backend-test
    - backend-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  allow_failure: false

# ================================
# SONARQUBE FRONTEND ANALYSIS
# ================================
sonarqube-frontend:
  stage: sonar
  image: node:22
  allow_failure: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-frontend-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - SONAR_TOKEN=$SONAR_TOKEN SONAR_HOST_URL=$SONAR_HOST_URL npm run sonar
  needs:
    - frontend-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ================================
# Docker backend build + push (NO DIND) - gated by E2E
# ================================
docker-backend:
  stage: docker
  image: docker:24
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      docker build \
        -t rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA \
        -f backend/Dockerfile \
        backend/
    - docker push rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-backend:latest
    - docker push rubberduck808/tripwire-backend:latest
  needs:
    - backend-build
    - backend-test
    - sonarqube-backend
    - frontend-e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ================================
# Docker frontend build + push (NO DIND) - gated by E2E
# ================================
docker-frontend:
  stage: docker
  image: docker:24
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      docker build \
        --build-arg VITE_API_URL="$VITE_API_URL" \
        --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" \
        -t rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA \
        -f frontend/Dockerfile \
        frontend/
    - docker push rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-frontend:latest
    - docker push rubberduck808/tripwire-frontend:latest
  needs:
    - frontend-build
    - frontend-test
    - sonarqube-frontend
    - frontend-e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ================================
# Deploy BACKEND to Cloud Run
# ================================
deploy-backend:
  stage: deploy
  image: google/cloud-sdk:latest
  needs:
    - docker-backend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "$GCP_PROJECT"
  script:
    - |
      gcloud run deploy tripwire-backend \
        --image docker.io/rubberduck808/tripwire-backend:latest \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --port 8080
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ================================
# Deploy FRONTEND to Cloud Run
# ================================
deploy-frontend:
  stage: deploy
  image: google/cloud-sdk:latest
  needs:
    - docker-frontend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "$GCP_PROJECT"
  script:
    - |
      gcloud run deploy tripwire-frontend \
        --image docker.io/rubberduck808/tripwire-frontend:latest \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --port 80
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
