stages:
  - build
  - test
  - sonar
  - docker
  - deploy

variables:
  DOCKER_HOST: tcp://host.docker.internal:2375
  DOCKER_TLS_CERTDIR: ""

  GCP_REGION: europe-west4
  GCP_PROJECT: tripwire-477820

  # SonarQube server
  SONAR_HOST_URL: "http://host.docker.internal:9000"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/

# ================================
# Backend build (NO TESTS HERE)
# ================================
backend-build:
  stage: build
  image: gradle:8.9-jdk21
  script:
    - cd backend
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ================================
# Frontend build
# ================================
frontend-build:
  stage: build
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ================================
# Backend tests + JaCoCo coverage 
# ================================
backend-test:
  stage: test
  image: gradle:8.9-jdk21

  services:
    - name: postgres:16
      alias: postgres

  variables:
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"

    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test

    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/testdb"
    SPRING_DATASOURCE_USERNAME: "test"
    SPRING_DATASOURCE_PASSWORD: "test"

    SPRING_FLYWAY_ENABLED: "true"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "none"

  script:
    - cd backend
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do echo "waiting for postgres..."; sleep 1; done
    - ./gradlew test jacocoTestReport

  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/jacoco/
      - backend/build/test-results/
      - backend/build/classes/
      - backend/build/reports/tests/
    expire_in: 1 week

  needs:
    - backend-build

# ================================
# Frontend Unit Tests + Coverage 
# ================================
frontend-test:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage/
      - frontend/coverage/lcov.info
  needs:
    - frontend-build

# ================================
# Frontend E2E Tests (Cypress)
# ================================
frontend-e2e:
  stage: test
  image: cypress/browsers:node-22.11.0-chrome-131.0.6778.85-1-ff-132.0.1-edge-131.0.2779.51-1
  services:
    - name: postgres:16
      alias: postgres-e2e
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    
    # Test database configuration
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-e2e:5432/testdb"
    SPRING_DATASOURCE_USERNAME: "test"
    SPRING_DATASOURCE_PASSWORD: "test"
    SPRING_PROFILES_ACTIVE: "test"
    SPRING_FLYWAY_ENABLED: "true"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    
    # Frontend and backend URLs for e2e tests
    CYPRESS_BASE_URL: "http://frontend-e2e:80"
    CYPRESS_API_URL: "http://backend-e2e:8080"
    VITE_API_URL: "http://backend-e2e:8080"
    VITE_MAPBOX_TOKEN: "test"
    
    # Ports (internal to docker network)
    BACKEND_PORT: "8080"
    FRONTEND_PORT: "80"
  
  before_script:
    # Install Docker Compose
    - apk add --no-cache docker-compose curl
    
    # Wait for postgres to be ready
    - apk add --no-cache postgresql-client
    - until pg_isready -h postgres-e2e -p 5432 -U "$POSTGRES_USER"; do echo "waiting for postgres..."; sleep 1; done
    
    # Build and start backend
    - echo "Building backend..."
    - cd backend
    - docker build -t backend-e2e:test -f Dockerfile .
    - cd ..
    
    # Build and start frontend
    - echo "Building frontend..."
    - cd frontend
    - docker build --build-arg VITE_API_URL="http://backend-e2e:8080" --build-arg VITE_MAPBOX_TOKEN="test" -t frontend-e2e:test -f Dockerfile .
    - cd ..
    
    # Start services
    - docker network create e2e-network || true
    - docker run -d --name postgres-e2e --network e2e-network -e POSTGRES_DB=$POSTGRES_DB -e POSTGRES_USER=$POSTGRES_USER -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD postgres:16
    - docker run -d --name backend-e2e --network e2e-network -p 8081:8080 -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres-e2e:5432/$POSTGRES_DB" -e SPRING_DATASOURCE_USERNAME=$POSTGRES_USER -e SPRING_DATASOURCE_PASSWORD=$POSTGRES_PASSWORD -e SPRING_PROFILES_ACTIVE=test -e SPRING_FLYWAY_ENABLED=true -e JWT_SECRET="$JWT_SECRET" backend-e2e:test
    - docker run -d --name frontend-e2e --network e2e-network -p 5174:80 -e VITE_API_URL="http://backend-e2e:8080" -e VITE_MAPBOX_TOKEN="test" frontend-e2e:test
    
    # Wait for services to be ready
    - echo "Waiting for backend..."
    - until curl -f http://localhost:8081/actuator/health; do sleep 2; done
    - echo "Waiting for frontend..."
    - until curl -f http://localhost:5174; do sleep 2; done
    
    # Install Cypress dependencies
    - cd frontend
    - npm ci

  script:
    # Run Cypress E2E tests
    - cd frontend
    - npm run test:e2e:test

  artifacts:
    when: always
    paths:
      - frontend/cypress/results/
      - frontend/cypress/screenshots/
      - frontend/cypress/videos/
    reports:
      junit: frontend/cypress/results/*.xml
    expire_in: 1 week

  needs:
    - frontend-build
    - backend-build
    - frontend-test


# ================================
# SONARQUBE BACKEND ANALYSIS 
# ================================
sonarqube-backend:
  stage: sonar
  image: gradle:8.9-jdk21
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"
  cache:
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - backend/.gradle/
  script:
    - cd backend
    # Verify JaCoCo report exists (should be available from backend-test job artifacts)
    - |
      if [ ! -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
        echo "ERROR: JaCoCo report not found. Please ensure backend-test job completed successfully."
        exit 1
      else
        echo "JaCoCo report found at build/reports/jacoco/test/jacocoTestReport.xml"
      fi
    # Run SonarQube analysis with all configuration matching build.gradle
    # Includes all test files: **/*Test.java and **/*IT.java
    - |
        ./gradlew sonar \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=false \
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
          -Dsonar.tests=src/test/java \
          -Dsonar.test.inclusions="**/*Test.java,**/*IT.java" \
          -Dsonar.exclusions="src/test/java/nl/fontys/db3/backend/BackendApplicationTests.java"
  needs:
    - backend-test
    - backend-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  allow_failure: false

# ================================
# SONARQUBE FRONTEND ANALYSIS
# ================================
sonarqube-frontend:
  stage: sonar
  image: node:22
  allow_failure: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-frontend-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - SONAR_TOKEN=$SONAR_TOKEN SONAR_HOST_URL=$SONAR_HOST_URL npm run sonar
  needs:
    - frontend-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ================================
# Docker backend build + push
# ================================
  docker-backend:
  stage: docker
  image: docker:24
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
        docker build \
          -t rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA \
          -f backend/Dockerfile \
          backend/
    - docker push rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-backend:latest
    - docker push rubberduck808/tripwire-backend:latest
  needs:
    - backend-build
    - backend-test
    - sonarqube-backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ================================
# Docker frontend build + push
# ================================
  docker-frontend:
  stage: docker
  image: docker:24
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
        docker build \
          --build-arg VITE_API_URL="$VITE_API_URL" \
          --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" \
          -t rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA \
          -f frontend/Dockerfile \
          frontend/
    - docker push rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-frontend:latest
    - docker push rubberduck808/tripwire-frontend:latest
  needs:
    - frontend-build
    - frontend-test
    - sonarqube-frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ================================
# Deploy BACKEND to Cloud Run
# ================================
  deploy-backend:
  stage: deploy
  image: google/cloud-sdk:latest
  needs:
    - docker-backend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project $GCP_PROJECT
  script:
    - |
        gcloud run deploy tripwire-backend \
          --image docker.io/rubberduck808/tripwire-backend:latest \
          --region "$GCP_REGION" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ================================
# Deploy FRONTEND to Cloud Run
# ================================
  deploy-frontend:
  stage: deploy
  image: google/cloud-sdk:latest
  needs:
    - docker-frontend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project $GCP_PROJECT
  script:
    - |
        gcloud run deploy tripwire-frontend \
          --image docker.io/rubberduck808/tripwire-frontend:latest \
          --region "$GCP_REGION" \
          --platform managed \
          --allow-unauthenticated \
          --port 80
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

