stages:
  - build
  - test
  - sonar
  - docker
  - deploy

variables:
  GCP_REGION: europe-west4
  GCP_PROJECT: tripwire-477820

  # SonarQube server (running on your PC)
  SONAR_HOST_URL: "http://host.docker.internal:9000"
  
  # Pipeline type: "auto" (default), "frontend", "backend", or "all"
  # - auto: run only the jobs affected by changed files (frontend/backend/all as needed)
  # - frontend/backend/all: force a pipeline "mode" manually
  # Set via GitLab UI: CI/CD → Variables → Add variable → PIPELINE_TYPE
  # Or via pipeline trigger: Variables → PIPELINE_TYPE = auto|frontend|backend|all
  PIPELINE_TYPE: "auto"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/

# ================================
# Backend build (NO TESTS HERE)
# ================================
backend-build:
  stage: build
  image: gradle:8.9-jdk21
  rules:
    - if: '$PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  script:
    - cd backend
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ================================
# Frontend build
# ================================
frontend-build:
  stage: build
  image: node:22
  rules:
    - if: '$PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ================================
# Backend tests + JaCoCo coverage
# ================================
backend-test:
  stage: test
  image: gradle:8.9-jdk21
  rules:
    - if: '$PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  services:
    - name: postgres:16
      alias: postgres
  variables:
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"

    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test

    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/testdb"
    SPRING_DATASOURCE_USERNAME: "test"
    SPRING_DATASOURCE_PASSWORD: "test"

    SPRING_FLYWAY_ENABLED: "true"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  script:
    - cd backend
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do echo "waiting for postgres..."; sleep 1; done
    - ./gradlew test jacocoTestReport
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/jacoco/
      - backend/build/test-results/
      - backend/build/classes/
      - backend/build/reports/tests/
    expire_in: 1 week
  needs:
    - backend-build

# ================================
# Frontend Unit Tests + Coverage
# ================================
frontend-test:
  stage: test
  image: node:22
  rules:
    - if: '$PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  script:
    - cd frontend
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage/
      - frontend/coverage/lcov.info
    expire_in: 1 week
  needs:
    - frontend-build

# ================================
# Docker Diagnostic Job - Test Docker Access (for debugging)
# ================================
docker-diagnostic:
  stage: test
  image: docker:24
  variables:
    # Force socket-based Docker (no DinD). Prevents inherited DOCKER_HOST=tcp://docker:2375.
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "=== Docker Diagnostic ==="
    - echo "Checking Docker installation..."
    - docker --version
    - docker compose version || echo "docker compose not available"
    - echo ""
    - echo "Checking Docker socket access..."
    - ls -la /var/run/docker.sock 2>&1 || echo "Docker socket not found at /var/run/docker.sock"
    - echo ""
    - echo "Testing Docker daemon connection..."
    - docker info 2>&1 || echo "Cannot connect to Docker daemon"
    - echo ""
    - echo "Testing docker compose..."
    - docker compose version 2>&1 || echo "docker compose failed"
    - echo ""
    - echo "Checking environment..."
    - env | grep -i docker || echo "No DOCKER_* environment variables found"
  allow_failure: true
  rules:
    - if: '$CI_DEBUG_TRACE == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: manual

# ================================
# Frontend E2E Tests (Cypress) - Option B (docker job + cypress container)
# ================================
frontend-e2e:
  stage: test
  image: docker:24
  rules:
    - if: '$PIPELINE_TYPE == "all"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - frontend/**/*
        - backend/**/*
        - docker-compose.e2e.yml
        - backend/Dockerfile
        - frontend/Dockerfile
        - .gitlab-ci.yml
    - when: never
  variables:
    COMPOSE_PROJECT_NAME: "e2e-${CI_PIPELINE_ID}"
    # Force socket-based Docker (no DinD). Prevents inherited DOCKER_HOST=tcp://docker:2375.
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    # Use localhost instead of host.docker.internal for better Linux runner compatibility
    # Services are accessible via host network or docker network
    CYPRESS_BASE_URL: "http://localhost:5174"
    CYPRESS_API_URL: "http://localhost:8081"
    VITE_API_URL: "http://localhost:8081"
    VITE_MAPBOX_TOKEN: "test"
  before_script:
    - apk add --no-cache docker-cli-compose curl
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml down -v --remove-orphans || true
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml up -d --build
    - |
      echo "Waiting for backend to be healthy..."
      i=1
      while [ $i -le 30 ]; do
        if curl -fsS http://localhost:8081/actuator/health >/dev/null 2>&1; then
          echo "✓ Backend is ready!"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "ERROR: Backend failed to start after 60 seconds"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs backend
          exit 1
        fi
        echo "Attempt $i/30: waiting for backend..."
        sleep 2
        i=$((i + 1))
      done
    - |
      echo "Waiting for frontend to be ready..."
      i=1
      while [ $i -le 30 ]; do
        if curl -fsS http://localhost:5174 >/dev/null 2>&1; then
          echo "✓ Frontend is ready!"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "ERROR: Frontend failed to start after 60 seconds"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs frontend
          exit 1
        fi
        echo "Attempt $i/30: waiting for frontend..."
        sleep 2
        i=$((i + 1))
      done
  script:
    - echo "Checking frontend directory..."
    - pwd
    - echo "Frontend directory contents:"
    - ls -la frontend/ | head -20 || echo "Frontend directory not found"
    - echo "Verifying package.json exists..."
    - test -f frontend/package.json && echo "✓ package.json found" || (echo "✗ package.json NOT found" && ls -la frontend/ | head -10)
    - |
      FRONTEND_DIR="$(pwd)/frontend"
      echo "Mounting frontend directory from: $FRONTEND_DIR"
      echo "Verifying source directory exists..."
      ls -la "$FRONTEND_DIR" | head -10 || echo "ERROR: Frontend directory not found at $FRONTEND_DIR"
      docker run --rm \
        --network host \
        -e CYPRESS_BASE_URL="$CYPRESS_BASE_URL" \
        -e CYPRESS_API_URL="$CYPRESS_API_URL" \
        --mount type=bind,source="$FRONTEND_DIR",target=/e2e,readonly=false \
        -w /e2e \
        --entrypoint="" \
        cypress/included:15.9.0 \
        sh -c "
          echo '=== Verifying mount ===';
          echo 'Current directory:';
          pwd;
          echo '';
          echo 'Contents of /e2e:';
          ls -la /e2e/ | head -20;
          echo '';
          echo 'Looking for package.json...';
          if [ -f /e2e/package.json ]; then
            echo '✓ package.json found';
            cat /e2e/package.json | head -5;
          else
            echo 'ERROR: package.json not found in /e2e';
            echo 'All files in /e2e:';
            find /e2e -maxdepth 1;
            echo 'All files recursively (first 20):';
            find /e2e -type f | head -20;
            exit 1;
          fi;
          echo '';
          echo '=== Running npm install ===';
          npm install;
          echo '';
          echo '=== Running Cypress ===';
          npx cypress run --headless --browser chrome
        "
  after_script:
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs --no-color || true
    - docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml down -v --remove-orphans || true
  artifacts:
    when: always
    reports:
      junit: frontend/cypress/results/*.xml
    paths:
      - frontend/cypress/results/
      - frontend/cypress/screenshots/
      - frontend/cypress/videos/
    expire_in: 1 week
  needs:
    - backend-build
    - frontend-build
    - frontend-test

# ================================
# SONARQUBE BACKEND ANALYSIS
# ================================
sonarqube-backend:
  stage: sonar
  image: gradle:8.9-jdk21
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_COMMIT_BRANCH'
    - if: '$PIPELINE_TYPE == "auto" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH'
      changes:
        - backend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"
  cache:
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - backend/.gradle/
  script:
    - cd backend
    - |
      if [ ! -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
        echo "ERROR: JaCoCo report not found. Ensure backend-test completed successfully."
        exit 1
      fi
    - |
      ./gradlew sonar \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=false \
        -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
        -Dsonar.tests=src/test/java \
        -Dsonar.test.inclusions="**/*Test.java,**/*IT.java" \
        -Dsonar.exclusions="src/test/java/nl/fontys/db3/backend/BackendApplicationTests.java"
  needs:
    - backend-test
    - backend-build
  allow_failure: false

# ================================
# SONARQUBE FRONTEND ANALYSIS
# ================================
sonarqube-frontend:
  stage: sonar
  image: node:22
  allow_failure: true
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_COMMIT_BRANCH'
    - if: '$PIPELINE_TYPE == "auto" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH'
      changes:
        - frontend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-frontend-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - SONAR_TOKEN=$SONAR_TOKEN SONAR_HOST_URL=$SONAR_HOST_URL npm run sonar
  needs:
    - frontend-test

# ================================
# Docker backend build + push (NO DIND) - gated by E2E
# ================================
docker-backend:
  stage: docker
  image: docker:24
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      docker build \
        -t rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA \
        -f backend/Dockerfile \
        backend/
    - docker push rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-backend:latest
    - docker push rubberduck808/tripwire-backend:latest
  needs:
    - job: backend-build
      optional: false
    - job: backend-test
      optional: false
    - job: sonarqube-backend
      optional: false
    - job: frontend-e2e
      optional: true

# ================================
# Docker frontend build + push (NO DIND) - gated by E2E
# ================================
docker-frontend:
  stage: docker
  image: docker:24
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      docker build \
        --build-arg VITE_API_URL="$VITE_API_URL" \
        --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" \
        -t rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA \
        -f frontend/Dockerfile \
        frontend/
    - docker push rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-frontend:latest
    - docker push rubberduck808/tripwire-frontend:latest
  needs:
    - job: frontend-build
      optional: false
    - job: frontend-test
      optional: false
    - job: sonarqube-frontend
      optional: false
    - job: frontend-e2e
      optional: true

# ================================
# Deploy BACKEND to Cloud Run
# ================================
deploy-backend:
  stage: deploy
  image: google/cloud-sdk:latest
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  needs:
    - docker-backend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "$GCP_PROJECT"
  script:
    - |
      gcloud run deploy tripwire-backend \
        --image docker.io/rubberduck808/tripwire-backend:latest \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --port 8080

# ================================
# Deploy FRONTEND to Cloud Run
# ================================
deploy-frontend:
  stage: deploy
  image: google/cloud-sdk:latest
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  needs:
    - docker-frontend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "$GCP_PROJECT"
  script:
    - |
      gcloud run deploy tripwire-frontend \
        --image docker.io/rubberduck808/tripwire-frontend:latest \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --port 80
