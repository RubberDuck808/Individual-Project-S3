stages:
  - build
  - test
  - sonar
  - docker
  - deploy

variables:
  DOCKER_HOST: tcp://host.docker.internal:2375
  DOCKER_TLS_CERTDIR: ""

  GCP_REGION: europe-west4
  GCP_PROJECT: tripwire-477820

  # SonarQube server
  SONAR_HOST_URL: "http://host.docker.internal:9000"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/

# ================================
# Backend build
# ================================
backend-build:
  stage: build
  image: gradle:8.9-jdk21
  script:
    - cd backend
    - ./gradlew clean build
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ================================
# Frontend build
# ================================
frontend-build:
  stage: build
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ================================
# Backend tests + JaCoCo coverage
# ================================
backend-test:
  stage: test
  image: gradle:8.9-jdk21

  services:
    - name: postgres:16
      alias: postgres

  variables:
    # Postgres container credentials
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test

    # Spring datasource for CI tests
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/testdb"
    SPRING_DATASOURCE_USERNAME: "test"
    SPRING_DATASOURCE_PASSWORD: "test"

    # Commonly needed in CI
    SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
    SPRING_FLYWAY_ENABLED: "false"

  script:
    - cd backend
    - ./gradlew test jacocoTestReport


# ================================
# SONARQUBE BACKEND ANALYSIS
# ================================
sonarqube-backend:
  stage: sonar
  image: gradle:8.9-jdk21
  allow_failure: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - cd backend
    - ./gradlew sonar
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
  needs:
    - backend-test
  rules:
    # run sonar on merge requests (recommended)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ================================
# Docker backend build + push
# ================================
docker-backend:
  stage: docker
  image: docker:24
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA -f backend/Dockerfile backend/
    - docker push rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-backend:latest
    - docker push rubberduck808/tripwire-backend:latest
  needs:
    - backend-build
  only:
    - main

# ================================
# Docker frontend build + push
# ================================
docker-frontend:
  stage: docker
  image: docker:24
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build --build-arg VITE_API_URL="$VITE_API_URL" --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" -t rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA -f frontend/Dockerfile frontend/
    - docker push rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-frontend:latest
    - docker push rubberduck808/tripwire-frontend:latest
  needs:
    - frontend-build
  only:
    - main

# ================================
# Deploy BACKEND to Cloud Run
# ================================
deploy-backend:
  stage: deploy
  image: google/cloud-sdk:latest
  needs:
    - docker-backend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project $GCP_PROJECT
  script:
    - gcloud run deploy tripwire-backend --image=docker.io/rubberduck808/tripwire-backend:latest --region=$GCP_REGION --platform=managed --allow-unauthenticated --port=8080
  only:
    - main

# ================================
# Deploy FRONTEND to Cloud Run
# ================================
deploy-frontend:
  stage: deploy
  image: google/cloud-sdk:latest
  needs:
    - docker-frontend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project $GCP_PROJECT
  script:
    - gcloud run deploy tripwire-frontend --image=docker.io/rubberduck808/tripwire-frontend:latest --region=$GCP_REGION --platform=managed --allow-unauthenticated --port=80
  only:
    - main
