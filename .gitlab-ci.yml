stages:
  - build
  - test
  - sonar
  - docker
  - deploy

variables:
  GCP_REGION: europe-west4
  GCP_PROJECT: tripwire-477820

  # SonarQube server (running on your PC)
  SONAR_HOST_URL: "http://host.docker.internal:9000"
  
  # Pipeline type: "auto" (default), "frontend", "backend", or "all"
  # - auto: run only the jobs affected by changed files (frontend/backend/all as needed)
  # - frontend/backend/all: force a pipeline "mode" manually
  # Set via GitLab UI: CI/CD → Variables → Add variable → PIPELINE_TYPE
  # Or via pipeline trigger: Variables → PIPELINE_TYPE = auto|frontend|backend|all
  PIPELINE_TYPE: "auto"
  # Set RUN_TESTS=false to skip unit tests and sonar stages (faster iteration)
  # Set RUN_TESTS=true or leave unset to run full pipeline
  RUN_TESTS: "true"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/

# ================================
# Backend build (NO TESTS HERE)
# ================================
backend-build:
  stage: build
  image: gradle:8.9-jdk21
  rules:
    - if: '$PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  script:
    - cd backend
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ================================
# Frontend build
# ================================
frontend-build:
  stage: build
  image: node:22
  rules:
    - if: '$PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ================================
# Backend tests + JaCoCo coverage
# ================================
backend-test:
  stage: test
  image: gradle:8.9-jdk21
  rules:
    - if: '$RUN_TESTS != "false" && ($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend")'
    - if: '$RUN_TESTS != "false" && $PIPELINE_TYPE == "auto"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  services:
    - name: postgres:16
      alias: postgres
  variables:
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"

    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test

    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/testdb"
    SPRING_DATASOURCE_USERNAME: "test"
    SPRING_DATASOURCE_PASSWORD: "test"

    SPRING_FLYWAY_ENABLED: "true"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  script:
    - cd backend
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do echo "waiting for postgres..."; sleep 1; done
    - ./gradlew test jacocoTestReport
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/jacoco/
      - backend/build/test-results/
      - backend/build/classes/
      - backend/build/reports/tests/
    expire_in: 1 week
  needs:
    - backend-build

# ================================
# Frontend Unit Tests + Coverage
# ================================
frontend-test:
  stage: test
  image: node:22
  rules:
    - if: '$RUN_TESTS != "false" && ($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend")'
    - if: '$RUN_TESTS != "false" && $PIPELINE_TYPE == "auto"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  script:
    - cd frontend
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage/
      - frontend/coverage/lcov.info
    expire_in: 1 week
  needs:
    - frontend-build

# ================================
# Docker Diagnostic Job - Test Docker Access (for debugging)
# ================================
docker-diagnostic:
  stage: test
  image: docker:24
  variables:
    # Force socket-based Docker (no DinD). Prevents inherited DOCKER_HOST=tcp://docker:2375.
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "=== Docker Diagnostic ==="
    - echo "Checking Docker installation..."
    - docker --version
    - docker compose version || echo "docker compose not available"
    - echo ""
    - echo "Checking Docker socket access..."
    - ls -la /var/run/docker.sock 2>&1 || echo "Docker socket not found at /var/run/docker.sock"
    - echo ""
    - echo "Testing Docker daemon connection..."
    - docker info 2>&1 || echo "Cannot connect to Docker daemon"
    - echo ""
    - echo "Testing docker compose..."
    - docker compose version 2>&1 || echo "docker compose failed"
    - echo ""
    - echo "Checking environment..."
    - env | grep -i docker || echo "No DOCKER_* environment variables found"
  allow_failure: true
  rules:
    - if: '$CI_DEBUG_TRACE == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: manual

# ================================
# Frontend E2E Tests (Playwright)
# ================================
frontend-e2e:
  stage: test
  image: docker:24
  services:
    # Docker-in-Docker daemon (requires runner.docker.privileged=true on the runner)
    - name: docker:24-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  rules:
    - if: '$PIPELINE_TYPE == "all"'
    - if: '$PIPELINE_TYPE == "auto"'
      changes:
        - frontend/**/*
        - backend/**/*
        - docker-compose.e2e.yml
        - backend/Dockerfile
        - frontend/Dockerfile
        - .gitlab-ci.yml
    - when: never
  variables:
    COMPOSE_PROJECT_NAME: "e2e-${CI_PIPELINE_ID}"
    # DinD: talk to the docker service container
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    # Playwright config reads this as baseURL; we run Playwright on the docker-compose network.
    PLAYWRIGHT_BASE_URL: "http://frontend"
    VITE_API_URL: "http://backend:8080"
    VITE_MAPBOX_TOKEN: "test"
  before_script:
    - |
      echo "=========================================="
      echo "=== E2E JOB START - DEBUGGING MODE ==="
      echo "=========================================="
      echo "Job ID: $CI_JOB_ID"
      echo "Pipeline ID: $CI_PIPELINE_ID"
      echo "Project Name: $COMPOSE_PROJECT_NAME"
      echo ""
      echo "=== Environment Variables ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "DOCKER_HOST: $DOCKER_HOST"
      echo "PLAYWRIGHT_BASE_URL: $PLAYWRIGHT_BASE_URL"
      echo "VITE_API_URL: $VITE_API_URL"
      echo "VITE_MAPBOX_TOKEN: $VITE_MAPBOX_TOKEN"
      echo ""
      echo "=== Current Directory ==="
      pwd
      echo ""
      echo "=== Directory Contents ==="
      ls -la
      echo ""
      echo "=== Frontend Directory ==="
      ls -la frontend/ || echo "frontend/ not found"
      echo ""
      echo "=== Backend Directory ==="
      ls -la backend/ || echo "backend/ not found"
    - apk add --no-cache docker-cli-compose curl
    # Ensure VITE_API_URL is explicitly set (override any global CI variable)
    - export VITE_API_URL="http://backend:8080"
    - |
      echo "=== Docker Installation Check ==="
      docker --version
      docker compose version
    # Wait for DinD to be ready
    - |
      echo ""
      echo "=== Waiting for DinD daemon ==="
      echo "DOCKER_HOST: $DOCKER_HOST"
      i=1
      while [ $i -le 30 ]; do
        echo "Attempt $i/30: Testing DinD connection..."
        if docker info >/dev/null 2>&1; then
          echo "✓ DinD is ready!"
          echo ""
          echo "=== Docker Info ==="
          docker info
          echo ""
          echo "=== Docker Networks ==="
          docker network ls
          echo ""
          echo "=== Docker Containers ==="
          docker ps -a
          break
        fi
        if [ $i -eq 30 ]; then
          echo "ERROR: DinD failed to start after 60 seconds"
          echo "Checking DinD service container..."
          docker ps -a | grep dind || echo "No dind container found"
          exit 1
        fi
        sleep 2
        i=$((i + 1))
      done
    - |
      echo ""
      echo "=== Cleaning up previous compose ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml down -v --remove-orphans || true
      echo "Cleanup complete"
    - |
      echo ""
      echo "=== Starting docker-compose services ==="
      echo "Project name: $COMPOSE_PROJECT_NAME"
      echo "Compose file: docker-compose.e2e.yml"
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml up -d --build
      echo ""
      echo "=== Compose services started ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps
      echo ""
      echo "=== Compose networks ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml network ls || docker network ls | grep "$COMPOSE_PROJECT_NAME"
    - |
      echo ""
      echo "=== Waiting for backend to be healthy ==="
      NETWORK_NAME="${COMPOSE_PROJECT_NAME}_default"
      echo "Network: $NETWORK_NAME"
      echo "Backend URL: http://backend:8080/actuator/health"
      i=1
      while [ $i -le 30 ]; do
        echo "Attempt $i/30: Checking backend health..."
        echo "  - Backend container status:"
        docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps backend || docker ps | grep backend
        echo "  - Testing health endpoint..."
        if docker run --rm --network "$NETWORK_NAME" curlimages/curl:8.11.1 \
          -fsS http://backend:8080/actuator/health 2>&1; then
          echo ""
          echo "✓ Backend is ready!"
          echo "Backend health check response:"
          docker run --rm --network "$NETWORK_NAME" curlimages/curl:8.11.1 \
            -fsS http://backend:8080/actuator/health
          break
        fi
        if [ $i -eq 30 ]; then
          echo ""
          echo "ERROR: Backend failed to start after 60 seconds"
          echo "=== Backend logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs backend
          echo ""
          echo "=== Backend container inspect ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps backend
          exit 1
        fi
        sleep 2
        i=$((i + 1))
      done
    - |
      echo ""
      echo "=== Waiting for frontend to be ready ==="
      NETWORK_NAME="${COMPOSE_PROJECT_NAME}_default"
      echo "Network: $NETWORK_NAME"
      echo "Frontend URL: http://frontend"
      i=1
      while [ $i -le 30 ]; do
        echo "Attempt $i/30: Checking frontend..."
        echo "  - Frontend container status:"
        docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps frontend || docker ps | grep frontend
        echo "  - Testing frontend endpoint..."
        if docker run --rm --network "$NETWORK_NAME" curlimages/curl:8.11.1 \
          -fsS http://frontend >/dev/null 2>&1; then
          echo ""
          echo "✓ Frontend is ready!"
          echo "Frontend response (first 200 chars):"
          docker run --rm --network "$NETWORK_NAME" curlimages/curl:8.11.1 \
            -fsS http://frontend | head -c 200
          echo ""
          break
        fi
        if [ $i -eq 30 ]; then
          echo ""
          echo "ERROR: Frontend failed to start after 60 seconds"
          echo "=== Frontend logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs frontend
          echo ""
          echo "=== Frontend container inspect ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps frontend
          exit 1
        fi
        sleep 2
        i=$((i + 1))
      done
    - |
      echo ""
      echo "=== Final Compose Status ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps
      echo ""
      echo "=== All Docker Containers ==="
      docker ps -a
      echo ""
      echo "=== All Docker Networks ==="
      docker network ls
  script:
    - |
      # DinD: bind mounts refer to THIS job container filesystem, so CI_PROJECT_DIR works as expected.
      set -eu
      
      echo ""
      echo "=========================================="
      echo "=== RUNNING PLAYWRIGHT E2E TESTS ==="
      echo "=========================================="
      echo ""
      echo "=== Pre-flight Checks ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Network: ${COMPOSE_PROJECT_NAME}_default"
      echo ""
      echo "=== Verifying project directory ==="
      echo "Project root exists:"
      ls -la "$CI_PROJECT_DIR" | head -10
      echo ""
      echo "Frontend directory exists:"
      ls -la "$CI_PROJECT_DIR/frontend" | head -20
      echo ""
      echo "=== Checking frontend/package.json ==="
      if [ -f "$CI_PROJECT_DIR/frontend/package.json" ]; then
        echo "✓ package.json found"
        cat "$CI_PROJECT_DIR/frontend/package.json" | head -20
      else
        echo "✗ ERROR: package.json NOT FOUND at $CI_PROJECT_DIR/frontend/package.json"
        echo "Full path contents:"
        find "$CI_PROJECT_DIR" -name "package.json" 2>/dev/null || echo "No package.json found anywhere"
        exit 1
      fi
      echo ""
      echo "=== Network connectivity test ==="
      echo "Testing backend from job container:"
      docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" curlimages/curl:8.11.1 \
        -fsS http://backend:8080/actuator/health || echo "Backend not reachable"
      echo ""
      echo "Testing frontend from job container:"
      docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" curlimages/curl:8.11.1 \
        -fsS http://frontend | head -c 100 || echo "Frontend not reachable"
      echo ""
      echo ""
      echo "=== Starting Playwright container ==="
      echo "Mount point: $CI_PROJECT_DIR -> $CI_PROJECT_DIR"
      echo "Working directory: $CI_PROJECT_DIR/frontend"
      echo "Environment:"
      echo "  PLAYWRIGHT_BASE_URL=$PLAYWRIGHT_BASE_URL"
      echo "  VITE_API_URL=$VITE_API_URL"
      echo "  VITE_MAPBOX_TOKEN=$VITE_MAPBOX_TOKEN"
      echo ""
      docker run --rm \
        --network "${COMPOSE_PROJECT_NAME}_default" \
        -v "${CI_PROJECT_DIR}:${CI_PROJECT_DIR}" \
        -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
        -e VITE_API_URL="$VITE_API_URL" \
        -e VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" \
        -w "${CI_PROJECT_DIR}/frontend" \
        --shm-size=2g \
        mcr.microsoft.com/playwright:v1.50.0-jammy \
        sh -lc "
          echo '=== Inside Playwright Container ==='
          echo 'Working directory:'
          pwd
          echo ''
          echo 'Directory contents:'
          ls -la
          echo ''
          echo 'Checking package.json:'
          if [ -f package.json ]; then
            echo '✓ package.json found'
            head -20 package.json
          else
            echo '✗ ERROR: package.json NOT FOUND'
            echo 'Current directory contents:'
            ls -la
            echo 'Parent directory:'
            ls -la ..
            exit 1
          fi
          echo ''
          echo 'Environment variables:'
          env | grep -E '(PLAYWRIGHT|VITE)' || echo 'No VITE/PLAYWRIGHT vars found'
          echo ''
          echo '=== Running npm ci ==='
          npm ci
          echo ''
          echo '=== Installing Playwright browsers ==='
          npx playwright install --with-deps chromium
          echo ''
          echo '=== Running Playwright tests ==='
          npx playwright test
        "
  after_script:
    - |
      echo ""
      echo "=========================================="
      echo "=== AFTER SCRIPT - COLLECTING LOGS ==="
      echo "=========================================="
      echo ""
      echo "=== Compose Services Status ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml ps || true
      echo ""
      echo "=== Backend Logs ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs --tail=100 backend || true
      echo ""
      echo "=== Frontend Logs ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs --tail=100 frontend || true
      echo ""
      echo "=== Postgres Logs ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs --tail=50 postgres || true
      echo ""
      echo "=== All Compose Logs (last 50 lines) ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml logs --tail=50 --no-color || true
      echo ""
      echo "=== Docker Container List ==="
      docker ps -a || true
      echo ""
      echo "=== Docker Network List ==="
      docker network ls || true
      echo ""
      echo "=== Cleaning up ==="
      docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.e2e.yml down -v --remove-orphans || true
      echo "Cleanup complete"
  artifacts:
    when: always
    reports:
      junit: frontend/test-results/junit.xml
    paths:
      - frontend/test-results/
      - frontend/playwright-report/
    expire_in: 1 week
  needs:
    - backend-build
    - frontend-build
    # Note: frontend-test removed for faster iteration - e2e doesn't need it

# ================================
# SONARQUBE BACKEND ANALYSIS
# ================================
sonarqube-backend:
  stage: sonar
  image: gradle:8.9-jdk21
  rules:
    - if: '$RUN_TESTS != "false" && ($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$RUN_TESTS != "false" && ($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_COMMIT_BRANCH'
    - if: '$RUN_TESTS != "false" && $PIPELINE_TYPE == "auto" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - if: '$RUN_TESTS != "false" && $PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH'
      changes:
        - backend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    JWT_SECRET: "ci-test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-algorithms-1234567890"
    SPRING_PROFILES_ACTIVE: "test"
  cache:
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - backend/.gradle/
  script:
    - cd backend
    - |
      if [ ! -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
        echo "ERROR: JaCoCo report not found. Ensure backend-test completed successfully."
        exit 1
      fi
    - |
      ./gradlew sonar \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=false \
        -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
        -Dsonar.tests=src/test/java \
        -Dsonar.test.inclusions="**/*Test.java,**/*IT.java" \
        -Dsonar.exclusions="src/test/java/nl/fontys/db3/backend/BackendApplicationTests.java"
  needs:
    - backend-test
    - backend-build
  allow_failure: false

# ================================
# SONARQUBE FRONTEND ANALYSIS
# ================================
sonarqube-frontend:
  stage: sonar
  image: node:22
  allow_failure: true
  rules:
    - if: '$RUN_TESTS != "false" && ($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$RUN_TESTS != "false" && ($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_COMMIT_BRANCH'
    - if: '$RUN_TESTS != "false" && $PIPELINE_TYPE == "auto" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - if: '$RUN_TESTS != "false" && $PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH'
      changes:
        - frontend/**/*
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-frontend-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - "${SONAR_USER_HOME}/cache"
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - SONAR_TOKEN=$SONAR_TOKEN SONAR_HOST_URL=$SONAR_HOST_URL npm run sonar
  needs:
    - frontend-test

# ================================
# Docker backend build + push (NO DIND) - gated by E2E
# ================================
docker-backend:
  stage: docker
  image: docker:24
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      docker build \
        -t rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA \
        -f backend/Dockerfile \
        backend/
    - docker push rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-backend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-backend:latest
    - docker push rubberduck808/tripwire-backend:latest
  needs:
    - job: backend-build
      optional: false
    - job: backend-test
      optional: false
    - job: sonarqube-backend
      optional: false
    - job: frontend-e2e
      optional: true

# ================================
# Docker frontend build + push (NO DIND) - gated by E2E
# ================================
docker-frontend:
  stage: docker
  image: docker:24
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      docker build \
        --build-arg VITE_API_URL="$VITE_API_URL" \
        --build-arg VITE_MAPBOX_TOKEN="$VITE_MAPBOX_TOKEN" \
        -t rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA \
        -f frontend/Dockerfile \
        frontend/
    - docker push rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA
    - docker tag rubberduck808/tripwire-frontend:$CI_COMMIT_SHORT_SHA rubberduck808/tripwire-frontend:latest
    - docker push rubberduck808/tripwire-frontend:latest
  needs:
    - job: frontend-build
      optional: false
    - job: frontend-test
      optional: false
    - job: sonarqube-frontend
      optional: false
    - job: frontend-e2e
      optional: true

# ================================
# Deploy BACKEND to Cloud Run
# ================================
deploy-backend:
  stage: deploy
  image: google/cloud-sdk:latest
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "backend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        - backend/Dockerfile
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  needs:
    - docker-backend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "$GCP_PROJECT"
  script:
    - |
      gcloud run deploy tripwire-backend \
        --image docker.io/rubberduck808/tripwire-backend:latest \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --port 8080

# ================================
# Deploy FRONTEND to Cloud Run
# ================================
deploy-frontend:
  stage: deploy
  image: google/cloud-sdk:latest
  rules:
    - if: '($PIPELINE_TYPE == "all" || $PIPELINE_TYPE == "frontend") && $CI_COMMIT_BRANCH == "main"'
    - if: '$PIPELINE_TYPE == "auto" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
        - frontend/nginx.conf
        - docker-compose*.yml
        - .gitlab-ci.yml
    - when: never
  needs:
    - docker-frontend
  before_script:
    - echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "$GCP_PROJECT"
  script:
    - |
      gcloud run deploy tripwire-frontend \
        --image docker.io/rubberduck808/tripwire-frontend:latest \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --port 80
