stages:
  - build
  - docker

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/

test-secret:
  stage: build
  script:
    - echo "Testing if GCP_SA_KEY is available..."
    - echo "${#GCP_SA_KEY} characters long"
    - echo "Starts with: $(echo "$GCP_SA_KEY" | head -c 30)"
    - echo "Ends with: $(echo "$GCP_SA_KEY" | tail -c 30)"
  only:
    - main





# ================================
# BACKEND BUILD (Gradle)
# ================================
backend-build:
  stage: build
  image: gradle:8.9-jdk21
  script:
    - cd backend
    - ./gradlew clean build
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ================================
# FRONTEND BUILD (Vite)
# ================================
frontend-build:
  stage: build
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ================================
# BACKEND DOCKER IMAGE
# ================================
docker-backend:
  stage: docker
  image: docker:24
  variables:
    DOCKER_HOST: tcp://host.docker.internal:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t "$DOCKERHUB_REPO_BACKEND:$CI_COMMIT_SHORT_SHA" -f backend/Dockerfile backend/
    - docker push "$DOCKERHUB_REPO_BACKEND:$CI_COMMIT_SHORT_SHA"
    - docker tag "$DOCKERHUB_REPO_BACKEND:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_REPO_BACKEND:latest"
    - docker push "$DOCKERHUB_REPO_BACKEND:latest"
  needs:
    - backend-build
  only:
    - main

# ================================
# FRONTEND DOCKER IMAGE
# ================================
docker-frontend:
  stage: docker
  image: docker:24
  variables:
    DOCKER_HOST: tcp://host.docker.internal:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t "$DOCKERHUB_REPO_FRONTEND:$CI_COMMIT_SHORT_SHA" -f frontend/Dockerfile frontend/
    - docker push "$DOCKERHUB_REPO_FRONTEND:$CI_COMMIT_SHORT_SHA"
    - docker tag "$DOCKERHUB_REPO_FRONTEND:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_REPO_FRONTEND:latest"
    - docker push "$DOCKERHUB_REPO_FRONTEND:latest"
  needs:
    - frontend-build
  only:
    - main
