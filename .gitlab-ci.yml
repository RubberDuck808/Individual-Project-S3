stages:
  - build
  - docker

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA"
  DOCKER_DRIVER: overlay2

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - Tripwire/backend/.gradle/
    - Tripwire/frontend/node_modules/

# === Backend build ===
backend-build:
  stage: build
  image: gradle:8.5-jdk17
  script:
    - cd Tripwire/backend
    - ./gradlew clean build
  artifacts:
    paths:
      - Tripwire/backend/build/libs/
    expire_in: 1 week

# === Frontend build ===
frontend-build:
  stage: build
  image: node:18
  script:
    - cd Tripwire/frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - Tripwire/frontend/dist/
    expire_in: 1 week

# === Docker build & push ===
docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
  - 'echo "Building Docker image: $DOCKER_IMAGE"'
  - docker build -t "$DOCKER_IMAGE" .
  - docker push "$DOCKER_IMAGE"

  only:
    - main
    - current-backend
  needs:
    - job: backend-build
    - job: frontend-build
