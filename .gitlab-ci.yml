stages:
  - build
  - docker

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""          
  GIT_STRATEGY: fetch             

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.gradle/
    - frontend/node_modules/

# === Backend build ===
backend-build:
  stage: build
  image: gradle:8.9-jdk21
  script:
    - cd backend
    - ./gradlew clean build
  artifacts:
    paths:
      - backend/build/libs/
    expire_in: 1 week

# === Frontend build ===
frontend-build:
  stage: build
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
      - frontend/build/
    expire_in: 1 week

# === Docker build & push ===
docker-build:
  stage: docker
  image: docker:24
  services:
    - name: docker:dind
      command: ["--tls=false"]    
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    GIT_STRATEGY: none            
  before_script:
    - apk add --no-cache git      
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - echo "Building Docker image: $DOCKER_IMAGE"
    - docker version
    - docker build -t "$DOCKER_IMAGE" .
    - docker push "$DOCKER_IMAGE"
  needs:
    - backend-build
    - frontend-build
  only:
    - main
    - current-backend
