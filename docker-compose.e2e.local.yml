version: "3.9"

# Local-only overrides for E2E.
# Publishes ports to the host so you can access backend/frontend/postgres from your machine.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.local.yml up -d --build
#
services:
  postgres:
    ports:
      - "5433:5432"

  backend:
    ports:
      - "8081:8080"

  frontend:
    ports:
      - "5174:80"

