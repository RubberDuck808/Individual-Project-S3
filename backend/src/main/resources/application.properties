spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Supabase
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Public assets base
app.storage.public-base-url=${ASSETS_PUBLIC_BASE_URL:https://storage.googleapis.com/tripwire_bucket}

# Optional prefixes
app.storage.hazard-icons-prefix=${HAZARD_ICONS_PREFIX:icons/hazards}
app.storage.preset-avatars-prefix=${PRESET_AVATARS_PREFIX:profile/avatars/preset}
app.storage.preset-backgrounds-prefix=${PRESET_BACKGROUNDS_PREFIX:profile/backgrounds/preset}
