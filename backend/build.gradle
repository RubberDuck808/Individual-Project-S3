plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "4.4.0.3356"
    id 'jacoco' 
}

group = 'nl.fontys.db3'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation "org.testcontainers:junit-jupiter:1.20.1"
    testImplementation "org.testcontainers:postgresql:1.20.1"


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.springframework.security:spring-security-test'

    implementation "com.google.cloud:google-cloud-storage:2.38.0"

}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport // generate JaCoCo report after tests
}

// JaCoCo configuration
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    executionData tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

// Allow jacocoTestReport to run even if tests fail
tasks.named('jacocoTestReport') {
    mustRunAfter tasks.test
}

// SonarQube configuration
sonar {
    properties {
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.projectKey", "I548789_individual-project-s3_0ed3868f-3af8-4e41-a583-5ab0e0896d70:backend"
        property "sonar.projectName", "Individual-Project-S3 (Backend)"
        property "sonar.organization", "default-organization"
        property "sonar.token", System.getenv("SONAR_TOKEN")
        property "sonar.qualitygate.wait", false
        property "sonar.skipCompile", "true"

        // link JaCoCo XML report
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.exclusions", "src/test/java/nl/fontys/db3/backend/BackendApplicationTests.java"
        
        // Exclude files that don't need coverage from analysis
        property "sonar.coverage.exclusions", """
            **/dto/**,
            **/entity/**,
            **/mapper/**,
            **/config/**,
            **/BackendApplication.java,
            **/exception/**,
            **/security/JwtService.java,
            **/security/CustomUserDetailsService.java
        """
    }
}
