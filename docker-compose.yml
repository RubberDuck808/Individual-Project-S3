version: '3.9'

services:
  # Note: If using Supabase locally, run 'supabase start' first
  # This will start Supabase services including PostgreSQL on port 54322
  # Then set SPRING_DATASOURCE_URL to: jdbc:postgresql://host.docker.internal:54322/postgres
  # Or use your hosted Supabase connection string in .env file

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8080:8080"
    env_file:
      - .env   # loads backend env variables from .env file
    # Environment variables are loaded from .env file
    # Your .env file contains Supabase connection details:
    # SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require
    # SPRING_DATASOURCE_USERNAME=postgres.dltyzhcmsapzfwmhswdl
    # SPRING_DATASOURCE_PASSWORD=your_password

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN} 
        VITE_API_URL: http://localhost:8080
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
